# Enterprise HRIS — Nginx reverse proxy
# Routes /api/* to the FastAPI backend and everything else to the Next.js app.

upstream hris_backend {
    server backend:8000;
}

upstream hris_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # ---- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://hris_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Backend OpenAPI docs (handy during development).
    location /docs {
        proxy_pass http://hris_backend/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://hris_backend/openapi.json;
        proxy_set_header Host $host;
    }

    # ---- Frontend (Next.js) -------------------------------------------------
    location / {
        proxy_pass http://hris_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # Next.js HMR websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
