# Alembic configuration (scaffolded for future migrations).
#
# The prototype boots via SQLAlchemy `create_all` in app/seed/bootstrap.py for
# reliability. Alembic is wired here so real migrations can be introduced later:
#
#   alembic revision --autogenerate -m "message"
#   alembic upgrade head
#
# The DB URL is read from the DATABASE_URL env var in migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
